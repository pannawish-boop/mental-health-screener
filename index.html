<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบคัดกรองสุขภาพจิตด้วยตนเอง</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body>
    <main class="container">
        <h1>แบบคัดกรองสุขภาพจิตด้วยตนเอง</h1>
        <p class="disclaimer"><strong>คำชี้แจง:</strong> เครื่องมือนี้มีวัตถุประสงค์เพื่อการศึกษาและการคัดกรองเบื้องต้นเท่านั้น ข้อมูลทั้งหมดจะถูกประมวลผลในเบราว์เซอร์ของคุณและไม่มีการบันทึกออนไลน์</p>

        <!-- Dropdown to select the specific test -->
        <label for="test-selector">เลือกเครื่องมือคัดกรอง:</label>
        <select id="test-selector" onchange="switchTest()">
            <option value="phq9">แบบประเมินโรคซึมเศร้า (PHQ-9)</option>
            <option value="gad7">แบบประเมินวิตกกังวล (GAD-7)</option>
            <option value="asrs">แบบคัดกรองสมาธิสั้นในผู้ใหญ่ (ASRS v1.1)</option>
            <option value="vanderbilt">แบบประเมินสมาธิสั้นในเด็ก (Vanderbilt - ฉบับผู้ปกครอง)</option>
            <option value="ad8">แบบคัดกรองภาวะสมองเสื่อม (AD8)</option>
            <option value="ldAdult">แบบสำรวจความเสี่ยงปัญหาการเรียนรู้ (LD)</option>
            <option value="tics">แบบคัดกรองอาการกระตุก (Tics)</option>
        </select>

        <!-- Interactive Form Area -->
        <form id="quiz-form">
            <div id="questions-container">
                <!-- JavaScript จะใส่คำถามที่นี่ -->
            </div>
            <button type="button" onclick="calculateScore()">คำนวณผลลัพธ์</button>
        </form>

        <!-- Results Area -->
        <div id="results-card" class="hidden">
            <h2>ผลการประเมินของคุณ</h2>
            <div id="score-display"></div>
            <div id="interpretation-display"></div>
            <button onclick="window.print()">🖨️ พิมพ์ผลลัพธ์เพื่อปรึกษาแพทย์</button>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
